name: fla ut test

on:
  workflow_call:
    inputs:
      matrix:
        required: false
        type: string
        default: '["ZW-M890P", "OAM-810E"]'
  workflow_dispatch:

permissions:
  contents: read

env:
  SAIL_IMAGE: download.t-head.cn/docker_release/pytorch:sdk2.2.0-2.10.0-ubuntu24.04-hggcrt3-py312-20261005

jobs:
  build-test:
    name: Build & Test (${{ matrix.runner }})
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJson(inputs.matrix || '["ZW-M890P", "OAM-810E"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build and Test on PPU
        id: ppu-test
        uses: t-head/ppu-scheduler-action@main
        with:
          image: ${{ env.SAIL_IMAGE }}
          nnodes: 0
          nproc_per_node: 1
          node_selector: "board-type=${{ matrix.runner }}"
          namespace: ppu-sched
          timeout_minutes: 450
          container_options: |
            cpus: "${{ matrix.runner == 'OAM-810E' && '11' || '31' }}"
            memory: "${{ matrix.runner == 'OAM-810E' && '112Gi' || '256Gi' }}"
          command: |
            set -euo pipefail
            cd /workspace/source

            # Use public dependency sources without image-baked URL rewrites.
            unset PIP_INDEX_URL
            export GIT_CONFIG_GLOBAL=/dev/null

            # PPU SDK and torch are pre-installed in the docker image.
            source /usr/local/PPU_SDK/envsetup.sh
            export MAX_JOBS=${{ matrix.runner == 'OAM-810E' && '11' || '31' }}
            export OMP_NUM_THREADS=1
            export MKL_NUM_THREADS=1

            pip install setuptools wheel junit-xml rich
            pip install --upgrade pytest

            echo "=== BUILD ==="
            pip3 install build
            python scripts/build_packages.py
            pip3 install --no-deps dist-packages/*.whl
            pip3 install 'transformers>=4.45.0' einops

            echo "=== TEST ==="
            # Archive live to NAS so partial results survive a scheduler kill.
            NAS_RESULT_DIR="/mnt/wl_nas/devops/fla-ci/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.runner }}"
            mkdir -p "$NAS_RESULT_DIR"
            set +e
            # Test-loop budget is 6h; the worker/job caps above must stay larger
            # than deadline + per-case timeout + build margin so the runner, not
            # the scheduler, always produces the verdict.
            python .github/workflows/scripts/pr-fla-ut.py \
              --caselist .github/workflows/scripts/casecmd.list \
              --timeout 4200 --deadline 21600 \
              --output-xml "$NAS_RESULT_DIR/test-results.xml" \
              2>&1 | tee "$NAS_RESULT_DIR/test-output.log"
            TEST_EXIT_CODE=${PIPESTATUS[0]}
            set -euo pipefail
            test -f "$NAS_RESULT_DIR/test-results.xml"
            test -s "$NAS_RESULT_DIR/test-output.log"
            exit "$TEST_EXIT_CODE"
          cleanup_policy: on_success

      - name: Test summary (${{ matrix.runner }})
        if: always()
        shell: bash
        run: |
          export NAS_RESULT_DIR="/wl_nas/devops/fla-ci/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.runner }}"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          import re
          import xml.etree.ElementTree as ET

          FAILURES_HEADER = re.compile(r"^=+\s*FAILURES\s*=+$")
          SECTION_HEADER = re.compile(r"^=+ .+ =+$")
          VERDICT_LINE = re.compile(r"^(FAILED|ERROR)\s+\S+")


          def failure_detail(text, limit=120):
              # pytest prints tracebacks mid-output and ends with duration
              # tables, so a plain tail window misses the actual failure.
              picked, in_section = [], False
              for line in (text or "").splitlines():
                  stripped = line.strip()
                  if FAILURES_HEADER.match(stripped):
                      in_section = True
                  elif in_section and SECTION_HEADER.match(stripped):
                      in_section = False
                      continue
                  if in_section or VERDICT_LINE.match(stripped):
                      picked.append(line)
              if not picked:
                  picked = (text or "").splitlines()[-60:]
              if len(picked) > limit:
                  omitted = len(picked) - limit
                  picked = picked[:limit]
                  picked.append(f"... ({omitted} more lines omitted)")
              return picked


          board = os.environ["NAS_RESULT_DIR"].rstrip("/").split("/")[-1]
          path = os.path.join(os.environ["NAS_RESULT_DIR"], "test-results.xml")
          if not os.path.isfile(path):
              print(f"## Runner: {board}")
              print(f"JUnit report not found: {path}")
              raise SystemExit(0)

          rows = []
          counts = {"PASS": 0, "FAIL": 0, "ERROR": 0, "SKIPPED": 0}
          tree = ET.parse(path)
          for tc in tree.getroot().iter("testcase"):
              name = tc.get("name", "?")
              secs = float(tc.get("time") or 0)
              failure = tc.find("failure")
              error = tc.find("error")
              skipped = tc.find("skipped")
              if failure is not None:
                  status, node = "FAIL", failure
              elif error is not None:
                  status, node = "ERROR", error
              elif skipped is not None:
                  status, node = "SKIPPED", skipped
              else:
                  status, node = "PASS", None
              counts[status] += 1
              rows.append((status, name, secs, node))

          print(f"## Runner: {board}")
          print(
              f"Total: {sum(counts.values())}, Passed: {counts['PASS']}, Failed: {counts['FAIL']}, "
              f"Error: {counts['ERROR']}, Skipped: {counts['SKIPPED']}"
          )
          for status, name, secs, node in rows:
              print(f"- {status} `{name}` ({secs:.0f}s)")
              if node is None:
                  continue
              print(f"  - Reason: {node.get('message') or 'unknown'}")
              if status == "SKIPPED":
                  continue
              detail = failure_detail(node.text)
              if detail:
                  print("  - Failure output:")
                  print("")
                  print("    ```")
                  for line in detail:
                      print(f"    {line}")
                  print("    ```")
          PY
